# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"
tone_instructions: "수석 모바일 아키텍트의 관점에서 한국어로 전문적이고 친절하며 명확하게 PR 코드 리뷰를 제공하십시오."
early_access: false

reviews:
  # 데이터 무결성이 핵심이라 코멘트를 더 받고 싶으면 "assertive"로 변경 (대신 소음 증가)
  profile: "chill"
  # 혼자 개발하는 저장소: GitHub 브랜치 보호에서 승인 필수를 걸 때만 true
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - "dependabot[bot]"
    # main 외 브랜치(develop 등)로 PR을 보낸다면 아래 주석을 풀고 지정
    # base_branches:
    #   - "main"
    #   - "develop"

  # 리뷰 노이즈 제거: 락 파일과 에셋은 리뷰 제외
  path_filters:
    - "!**/package-lock.json"
    - "!**/yarn.lock"
    - "!**/pnpm-lock.yaml"
    - "!assets/**"

  path_instructions:
    - path: "src/database/**"
      instructions: |
        데이터 무결성을 최우선으로 검토하십시오.
        - 학생 정보 삭제 시 연결된 수업 일지(@class_records)와 주간 시간표(@weekly_schedule)가 함께 연쇄 삭제(Cascade Delete)되는지 확인하십시오.
        - AsyncStorage에는 트랜잭션이 없으므로, 연쇄 삭제/저장은 multiRemove/multiSet 등 한 번의 호출로 처리하는지, 중간 실패 시 데이터 일관성이 깨지지 않는지 확인하십시오.
        - AsyncStorage 키 표준(@students, @class_records, @weekly_schedule)을 준수하는지 확인하십시오.
        - Google Drive 백업/복원 JSON(mydiary_backup.json)에 구버전 호환용 fallback 기본값이 존재하는지 확인하십시오.
        - 백업 JSON에 스키마 버전 필드가 있고, 구조 변경 시 버전별 마이그레이션 처리가 있는지 확인하십시오.
    - path: "src/services/**"
      instructions: |
        - HWPX 생성(HwpxExportService.js) 시 국가 표준 KS X 6101 OWPML XML 마크업의 유효성(닫는 태그 누락 방지, 유효한 속성값)을 철저히 검토하십시오.
        - XML에 학생 이름, 일지 내용 등 사용자 입력을 넣을 때 &, <, >, 따옴표 등 특수문자를 이스케이프하는지 확인하십시오.
        - 파일 I/O 및 외부 API 연동 시 try-catch 예외 처리와 크래시 방지(Never Crash) 원칙이 준수되었는지 확인하십시오.
        - Google Drive 연동에서 토큰 만료, 오프라인, 타임아웃, 사용자 취소 상황이 처리되는지 확인하십시오.
    - path: "src/screens/**"
      instructions: |
        - useTheme() 훅을 통한 theme.js 디자인 토큰(색상, 모서리 roundness: 12) 준수 여부를 확인하십시오. 임의의 16진수 색상 하드코딩은 지양합니다.
        - 터치 가능한 모든 요소가 최소 44x44 dp 크기를 확보했는지, Safe Area가 적절히 대응되었는지 검토하십시오.
        - 접근성(accessibilityLabel, accessibilityRole) 지정 여부를 확인하십시오.
        - 키보드가 입력창을 가리지 않는지(KeyboardAvoidingView 등), 긴 목록은 FlatList 등으로 가상화되어 있는지 확인하십시오.
    - path: "src/components/**"
      instructions: |
        재사용 컴포넌트가 특정 화면의 상태에 강하게 결합되지 않고 독립적인지 검토하십시오.
        공용 팝업은 ConfirmModal.js, 구분선은 Separator.js를 우선 활용했는지 확인하십시오.
    - path: "src/utils/**"
      instructions: |
        DRY(Don't Repeat Yourself) 원칙을 준수하여 날짜 관련 로직은 dateUtils.js, 문자열/포맷 처리는 stringUtils.js의 공용 순수 함수를 재사용했는지 확인하십시오.
    - path: "docs/**"
      instructions: |
        프로젝트 공식 엔지니어링 표준(docs/INDEX.md, docs/gaps.md, docs/architecture.md 등)의 단일 진실 공급원(SSOT) 원칙과 상호 링크 무결성을 검토하십시오.
    - path: "**/*.test.{js,jsx,ts,tsx}"
      instructions: |
        학생 삭제 연쇄, 백업/복원, 날짜 계산 같은 핵심 로직의 경계 조건(빈 데이터, 구버전 백업, 잘못된 입력)이 테스트되는지 확인하십시오.
    - path: "__tests__/**"
      instructions: |
        학생 삭제 연쇄, 백업/복원, 날짜 계산 같은 핵심 로직의 경계 조건(빈 데이터, 구버전 백업, 잘못된 입력)이 테스트되는지 확인하십시오.
    - path: "{package.json,app.json,eas.json}"
      instructions: |
        - 의존성 추가/변경 시 필요성과 Expo SDK 호환성을 확인하십시오.
        - 불필요한 권한(permissions) 추가가 없는지 확인하십시오.
        - 시크릿(키, 토큰)이 포함되어 있지 않은지 확인하십시오.
    - path: ".github/workflows/**"
      instructions: |
        워크플로에 시크릿이 평문으로 노출되지 않는지, 불필요하게 넓은 권한(permissions)이 없는지 확인하십시오.

  # 머지 전 점검: 처음에는 warning으로 시작하고, 오탐이 없음을 확인한 뒤 error로 올리십시오.
  pre_merge_checks:
    # JS/React Native 프로젝트에서는 오탐이 많아 끔
    docstrings:
      mode: "off"
    custom_checks:
      - name: "No Hardcoded Credentials"
        mode: "error"
        instructions: |
          API 키, 토큰, 비밀번호, OAuth 클라이언트 시크릿이 코드에 하드코딩되어 있으면 실패 처리하라.
          테스트 파일과 예시(.example) 파일은 제외한다.
      - name: "Student Cascade Delete"
        mode: "warning"
        instructions: |
          학생 삭제 로직이 변경되면, 연결된 @class_records와 @weekly_schedule 데이터도
          함께 삭제되는지 확인하라. 누락되면 실패 처리하라.
      - name: "No Personal Data Logging"
        mode: "warning"
        instructions: |
          console.log 등으로 학생 이름, 수업 일지 내용 같은 개인정보를
          출력하는 코드가 있으면 실패 처리하라.
      - name: "Theme Token Only"
        mode: "warning"
        instructions: |
          src/screens/** 와 src/components/** 에서 theme.js 토큰 대신
          16진수 색상(#xxxxxx)을 직접 쓰면 실패 처리하라.

  # AI 판단 외에 기계적 검사 추가
  tools:
    gitleaks:
      enabled: true
    eslint:
      enabled: true
    markdownlint:
      enabled: true

# docs 폴더 및 최상위 헌장 문서를 리뷰 시 참고 자료로 활용
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "docs/**/*.md"
      - "AGENTS.md"

chat:
  auto_reply: true
