name: Android Release Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version name (e.g. v2.3.0)'
        required: false
        default: 'manual'

# 최소 권한 원칙 (Least Privilege)
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. 런타임 환경 구성
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 2. 의존성 설치 및 품질 게이트 (린트 & 테스트 무결성 검증)
      - name: Install Dependencies
        run: npm ci

      - name: Run Quality Gate (ESLint & Tests)
        run: |
          npm run lint
          npm test -- --watchAll=false

      # 3. 보안 환경 변수 (.env) 생성
      - name: Configure Environment Variables
        env:
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -n "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" ]; then
            echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          fi

      # 4. 서명 키(Keystore) 복원 및 권한 잠금 (특수문자/줄바꿈 변형 없는 안전 복원)
      - name: Restore Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not configured!"
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const buf = Buffer.from(process.env.KEYSTORE_BASE64, 'base64');
            fs.writeFileSync('android/app/mydiary-release-key.keystore', buf);
          "
          chmod 600 android/app/mydiary-release-key.keystore

      # 5. 서명 프로퍼티(key.properties) 안전 주입 (특수문자 비밀번호 완전 보호)
      - name: Configure Gradle Signing Properties
        env:
          STORE_PASSWORD: ${{ secrets.MYDIARY_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MYDIARY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MYDIARY_RELEASE_KEY_PASSWORD }}
        run: |
          node -e "
            const fs = require('fs');
            const lines = [
              'MYDIARY_RELEASE_STORE_FILE=mydiary-release-key.keystore',
              'MYDIARY_RELEASE_STORE_PASSWORD=' + (process.env.STORE_PASSWORD || ''),
              'MYDIARY_RELEASE_KEY_ALIAS=' + (process.env.KEY_ALIAS || ''),
              'MYDIARY_RELEASE_KEY_PASSWORD=' + (process.env.KEY_PASSWORD || '')
            ];
            fs.writeFileSync('android/key.properties', lines.join('\n') + '\n');
          "
          chmod 600 android/key.properties

      # 5-1. Linux 호스트 링커 오염 방지 (NDK 27 + CMake LTO 호환성 보장)
      - name: Fix Host Linker Pollution for NDK
        run: |
          # NDK 27에서 지원 중단된 gold 링커를 호스트 우분투의 /usr/bin/ld.gold가 가로채어 ELF 불일치 에러를 내는 문제 방지
          sudo rm -f /usr/bin/ld.gold

      # 6. Android 릴리즈 APK 빌드
      - name: Build Android Release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      # 6-1. 실패 시 CMakeError.log 직접 출력 (접힘 없이 즉시 확인)
      - name: Dump CMake Logs on Failure
        if: failure()
        run: |
          echo "==================== CMAKE ERROR LOG ===================="
          for logfile in $(find android/app/.cxx -name "CMakeError.log"); do
            echo ">>> FILE: $logfile <<<"
            cat "$logfile"
            echo "--------------------------------------------------------"
          done

      # 7. 민감 정보 안전 파기 (Secure Ephemeral Cleanup - 빌드 성공/실패 무관하게 항상 실행)
      - name: Secure Cleanup Credentials
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/mydiary-release-key.keystore
          rm -f .env
          echo "All temporary credentials and keystores securely cleaned up."

      # 8. 배포용 파일명 패키징
      - name: Prepare Release Artifact
        run: |
          VERSION="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_version }}" ]; then
            VERSION="${{ github.event.inputs.release_version }}"
          fi
          # v 접두사 정리 (MyDiary-v2.3.0.apk)
          APK_NAME="MyDiary-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "./${APK_NAME}"
          echo "RELEASE_APK=${APK_NAME}" >> $GITHUB_ENV

      # 9. GitHub Releases에 서명된 APK 자동 배포
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.RELEASE_APK }}
          generate_release_notes: true
          draft: false
          prerelease: false

      # 10. 워크플로우 아티팩트로도 보존 (수동 실행 시 다운로드 가능)
      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_APK }}
          path: ${{ env.RELEASE_APK }}
          retention-days: 14
